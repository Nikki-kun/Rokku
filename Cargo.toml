[package]
name = "rokku"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
ulog-rs = "0.0.4"
env_logger = "0.11"
log = "0.4"
binrw = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plotters-iced = "0.11"
iced = { version = "0.13", features = ["canvas", "tokio"] }
plotters = "0.3"
plotters-backend = "0.3"
rfd = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
iced_fonts = { version = "0.2", features = ["nerd"] }
